<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Light</title>
<style>
:root{--bg:#000;--card:#14141c;--line:#2a2a38;--text:#fff;--muted:#8e8e93;--teal:#2dd4bf;--purple:#c084fc}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{padding-bottom:88px}
header{display:flex;align-items:center;gap:12px;padding:16px 20px 8px}
.mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#2dd4bf,#c084fc);flex-shrink:0}
.brand h1{font-size:22px;font-weight:700}
.brand h1 span{background:linear-gradient(90deg,#2dd4bf,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{font-size:11px;letter-spacing:2.4px;color:#8e8e93;margin-top:2px}
.hero{margin:12px 20px 0;border-radius:22px;overflow:hidden;background:#0c1220}
.hero img{width:100%;height:auto;display:block}
.section{padding:24px 20px 0}
.eye{font-size:12px;letter-spacing:2.4px;color:#8e8e93;margin-bottom:8px}
h2{font-size:30px;line-height:1.15;margin-bottom:10px;font-weight:700}
h2 .g{background:linear-gradient(90deg,#c084fc,#2dd4bf);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:#c7c7cc;font-size:15.5px;line-height:1.55}
.tool{background:#14141c;border:1px solid #2a2a38;border-radius:16px;padding:16px;margin:10px 0}
.tool b{display:block;font-size:16px;margin-bottom:4px}
.tool span{color:#8e8e93;font-size:14px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.preset{background:#1b1b26;border:1px solid #2a2a38;color:#fff;border-radius:999px;padding:10px 14px;font-size:14px;font-weight:600}
.preset.on{border-color:#2dd4bf;color:#2dd4bf}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);border-top:1px solid #1c1c26;display:flex;justify-content:space-around;padding:10px 4px 22px}
nav button{background:0;border:0;color:#8e8e93;font-size:11px}
nav button.on{color:#2dd4bf}
.ok{display:none;color:#2dd4bf;font-size:13px;margin-top:8px}
.page{display:none}
.page.on{display:block}
</style>
</head>
<body>
<header>
  <div class="mark" aria-hidden="true"></div>
  <div class="brand">
    <h1>First <span>Light</span></h1>
    <p>LEARN SLEEP AGAIN</p>
  </div>
</header>
<div class="page on" id="page-today">
  <div class="hero"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA4KCw0LCQ4NDA0QDw4RFiQXFhQUFiwgIRokNC43NjMuMjI6QVNGOj1OPjIySGJJTlZYXV5dOEVmbWVabFNbXVn/2wBDAQ8QEBYTFioXFypZOzI7WVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVn/wAARCAJMAaQDASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAwQAAQIFBv/EAEIQAAIBAwIEAwYFAwMDBQAAAAECAwAEEQUSITFBBhMiUWFxgZEyobEHFEJS0SNiwfAkM3KC8RVDYqLS/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QAJBEBAQEAAgICAgIDAQAAAAAAAAERAiEDEjEEQRMiUWEycYH/2Q==" alt="Buddha with glowing lotus"></div>
  <section class="section">
    <div class="eye">A QUIET COURSE</div>
    <h2>Sleep is a <span class="g">skill</span>. You can <span class="g">relearn it</span>.</h2>
    <p class="lede">A local companion using clinic CBT-I methods: a diary, a regular rise time, the bed-as-sleep rule, and a calmer mind at night.</p>
  </section>
</div>
</body>
</html>
